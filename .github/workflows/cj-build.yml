      - name: Make CJ icons
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          R = 'app/src/main/res/'
          FP = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def draw(size, bg, safe):
              im = Image.new('RGBA', (size, size), bg)
              d = ImageDraw.Draw(im)
              f = ImageFont.truetype(FP, int(size * safe))
              b = d.textbbox((0, 0), 'CJ', font=f)
              d.text(((size - (b[2] - b[0])) / 2 - b[0], (size - (b[3] - b[1])) / 2 - b[1]), 'CJ', font=f, fill=(255, 214, 140, 255))
              return im
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for dens, (l, a) in sizes.items():
              p = R + 'mipmap-' + dens + '/'
              draw(l, (138, 43, 18, 255), .42).save(p + 'ic_launcher.png')
              draw(a, (0, 0, 0, 0), .30).save(p + 'ic_launcher_foreground.png')
          PY

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CJ-apk
          path: app/build/outputs/apk/debug/*.apk
          
